name: Nightly hardening

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: nightly fuzz/miri-shape (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            miri: skip
          - os: ubuntu-latest
            miri: run
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91.0 with components
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      # Bounded hardening hooks (fast subset also runs in ordinary CI via
      # the hardening_hooks test target). Scheduled failures are visible
      # here and are never masked by moving tests to NOTRUN.
      - name: hardening hooks (extended output)
        run: cargo test --package boa_fapi --test hardening_hooks -- --nocapture
        env:
          CARGO_TERM_COLOR: always

      - name: WPT harness units
        run: cargo test --package boa_fapi_wpt -- --nocapture

      # Miri gate: a missing nightly toolchain is an explicit SKIP, but a
      # started Miri test must fail the job when the test itself fails.
      - name: Install nightly Miri
        id: miri_setup
        if: matrix.miri == 'run'
        continue-on-error: true
        run: rustup toolchain install nightly --component miri --profile minimal

      - name: miri (boa_fapi_core lib, bounded)
        if: matrix.miri == 'run' && steps.miri_setup.outcome == 'success'
        timeout-minutes: 20
        run: cargo +nightly miri test --package boa_fapi_core --lib

      - name: Miri unavailable
        if: matrix.miri == 'run' && steps.miri_setup.outcome != 'success'
        run: echo "miri unavailable on this runner/target → SKIP (no-miri-toolchain)"

      - name: miri (Windows — compatible hooks only)
        if: matrix.miri == 'skip'
        run: echo "miri on Windows → SKIP (miri-toolchain-ubuntu-only); compatible hardening hooks ran above"

      - name: hardening fuzz (fixed seed, input cap, bounded time)
        timeout-minutes: 10
        run: cargo test --package boa_fapi --test hardening_hooks fuzz_decode_bounded -- --nocapture
        env:
          CARGO_TERM_COLOR: always
