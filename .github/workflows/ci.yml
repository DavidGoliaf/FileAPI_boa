name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_DB_PATH: target/cargo-deny-advisories

jobs:
  m3-validation:
    name: M8 validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91.0 with components
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-deny, cargo-llvm-cov, cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov,cargo-hack

      # Work order M9-E (M1–M8 order preserved, then M9-A…M9-D, then M9-E).
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace --all-features

      - name: cargo test (M8 tracing feature-off guard)
        run: cargo test --package boa_fapi --test m8_feature_off -- --nocapture

      - name: cargo test (M2 JS integration)
        run: cargo test --package boa_fapi --test m2_blob_file_filelist -- --nocapture

      - name: cargo test (M3-A promise reads)
        run: cargo test --package boa_fapi --test m3_promise_blob_reads -- --nocapture

      - name: cargo test (M3-B blob streams)
        run: cargo test --package boa_fapi --test m3_blob_streams -- --nocapture

      - name: cargo test (M4-A FileReader async)
        run: cargo test --package boa_fapi --test m4_filereader_async -- --nocapture

      - name: cargo test (M4-B FileReaderSync)
        run: cargo test --package boa_fapi --test m4_filereader_sync -- --nocapture

      - name: cargo test (boa_fapi_fs)
        run: cargo test --package boa_fapi_fs --all-features -- --nocapture

      - name: cargo test (M5 filesystem File)
        run: cargo test --package boa_fapi --test m5_file_fs -- --nocapture

      - name: cargo test (M6 core URL/clone)
        run: cargo test --package boa_fapi_core --test blob_url -- --nocapture

      - name: cargo test (M6 Blob URL)
        run: cargo test --package boa_fapi --test m6_blob_url -- --nocapture

      - name: cargo test (M6 structured clone)
        run: cargo test --package boa_fapi --test m6_structured_clone -- --nocapture

      - name: cargo test (M7 appendix-A acceptance)
        run: cargo test --package boa_fapi --test appendix_a_acceptance -- --nocapture

      - name: cargo test (M7 abort races)
        run: cargo test --package boa_fapi --test abort_races -- --nocapture

      - name: cargo test (M7 abort races, fs)
        run: cargo test --package boa_fapi --test abort_races_fs -- --nocapture

      - name: cargo test (M7 hardening hooks)
        run: cargo test --package boa_fapi --test hardening_hooks -- --nocapture

      - name: cargo test (M7 WPT harness units)
        run: cargo test --package boa_fapi_wpt -- --nocapture

      - name: cargo test (M8 observability)
        run: cargo test --package boa_fapi --test m8_observability --all-features -- --nocapture

      - name: WPT smoke run (offline, no upstream checkout)
        run: cargo run --package boa_fapi_wpt -- --manifest wpt-manifest.json --smoke --json target/wpt-smoke.json

      - name: WPT upstream checkout (pinned commit, FileAPI scope)
        run: |
          git init --quiet target/pinned-wpt
          git -C target/pinned-wpt config core.autocrlf false
          git -C target/pinned-wpt config core.eol lf
          git -C target/pinned-wpt remote add origin https://github.com/web-platform-tests/wpt
          git -C target/pinned-wpt fetch --quiet --depth 1 origin 0968c868d8095217d18d86b34c7f21dccae58768
          git -C target/pinned-wpt checkout --quiet FETCH_HEAD -- FileAPI/

      # Observation only: reproduces the audited expectations artifact. It is
      # NOT a release verdict and never claims conformance. The required
      # release status lives in the separate `m9e-release-conformance` job.
      - name: WPT observation run (--check-expectations)
        run: cargo run --package boa_fapi_wpt -- --manifest wpt-manifest.json --expectations expectations.json --upstream-root target/pinned-wpt --check-expectations --json target/wpt-observation.json --junit target/wpt-observation.xml

      - name: WPT observation run (threads 2, ordered output)
        run: cargo run --package boa_fapi_wpt -- --manifest wpt-manifest.json --expectations expectations.json --upstream-root target/pinned-wpt --check-expectations --threads 2 --json target/wpt-observation-t2.json

      - name: WPT observation check (expectations match, release verdict consistent, determinism)
        shell: pwsh
        run: >
          $json = Get-Content target/wpt-observation.json -Raw | ConvertFrom-Json;
          if ($json.mode -ne 'WPT_CHECK_EXPECTATIONS') { throw "expected WPT_CHECK_EXPECTATIONS, got $($json.mode)" };
          if ($json.expectations_match -ne $true) { throw "expectations_match must be true" };
          if ($json.inventory.total -ne 115) { throw "inventory.total must be 115, got $($json.inventory.total)" };
          if ($json.inventory.unaccounted -ne 0) { throw "inventory.unaccounted must be 0, got $($json.inventory.unaccounted)" };
          if ($json.results.total -ne $json.results.unique) { throw "results.total must equal results.unique" };
          if ($json.results.unexpected -ne 0) { throw "unexpected rows must be 0, got $($json.results.unexpected)" };
          if ($json.release_blockers.defects -gt 0 -and $json.release_green -ne $false) { throw "release_green must be false while defects remain" };
          if ($json.release_blockers.defects -eq 0 -and $json.release_green -ne $true) { throw "release_green must be true once every release blocker is gone" };
          $sha1 = (Get-FileHash target/wpt-observation.json -Algorithm SHA256).Hash;
          $sha2 = (Get-FileHash target/wpt-observation-t2.json -Algorithm SHA256).Hash;
          if ($sha1 -ne $sha2) { throw "threads 1/2 JSON must be byte-identical: $sha1 vs $sha2" }

      - name: Upload WPT reports
        uses: actions/upload-artifact@v4
        with:
          name: wpt-reports-${{ matrix.os }}
          path: |
            target/wpt-smoke.json
            target/wpt-observation.json
            target/wpt-observation.xml
            target/wpt-observation-t2.json

      - name: SBOM (cargo tree)
        run: cargo tree --workspace --all-features --prefix none > target/sbom.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}
          path: target/sbom.txt

      # NOTE: there is deliberately no `cargo test --workspace
      # --no-default-features` step. The lib unit suites (`src/tests.rs`,
      # `promise_read/streams/filereader*/webidl` child modules) and every
      # JS integration suite register the extension with default shims and
      # fail by design without them (`StreamsShimDisabled`, pre-existing
      # since M2/M3). Feature-combination coverage lives in the
      # `cargo hack --feature-powerset` step below, which type-checks every
      # combination.

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

      - name: cargo test --doc
        run: cargo test --package boa_fapi --doc

      - name: Install wasm32 target (Ubuntu memory-only gate)
        if: matrix.os == 'ubuntu-latest'
        run: rustup target add wasm32-unknown-unknown

      - name: wasm memory-only check (boa_fapi_core)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --target wasm32-unknown-unknown --package boa_fapi_core

      - name: wasm memory-only check (boa_fapi no-default lib)
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --target wasm32-unknown-unknown --package boa_fapi --no-default-features --lib

      - name: cargo llvm-cov (boa_fapi_core >= 85)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --package boa_fapi_core --all-features --fail-under-lines 85

      - name: cargo llvm-cov (boa_fapi >= 80)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --package boa_fapi --all-features --fail-under-lines 80

      - name: cargo llvm-cov
        # `boa_fapi_wpt/src/main.rs` is a thin CLI binary (arg parsing,
        # worker spawning, report wiring): its unit-test cover is ~26% by
        # design, which drags the whole-workspace line aggregate below 80
        # even when every library is above its threshold (core >= 85,
        # boa_fapi >= 80, fs/wpt-lib covered by their own suites). The
        # per-package gates above are the normative coverage contract;
        # this workspace run excludes the CLI binary from the report so a
        # `main()`-shaped file cannot veto an otherwise green gate.
        run: cargo llvm-cov --workspace --all-features --exclude-from-report boa_fapi_wpt --fail-under-lines 80

      - name: cargo hack (feature powerset, incl. tracing)
        run: cargo hack check --feature-powerset --depth 2

      - name: cargo package (workspace)
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --workspace --all-features

      - name: cargo deny fetch db
        run: cargo deny fetch db

      - name: cargo deny check
        run: cargo deny check

      - name: git diff --check
        run: git diff --check

  # Required release status (M9E-R1 §6): `--strict` with no exit-code
  # inversion, no `continue-on-error` and no masking. While the recorded
  # product/harness defects remain, this job is honestly red; once they are
  # fixed it turns green without any workflow change.
  m9e-release-conformance:
    name: M9E release conformance (strict gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@1.91.0

      - name: WPT upstream checkout (pinned commit, FileAPI scope)
        run: |
          git init --quiet target/pinned-wpt
          git -C target/pinned-wpt config core.autocrlf false
          git -C target/pinned-wpt config core.eol lf
          git -C target/pinned-wpt remote add origin https://github.com/web-platform-tests/wpt
          git -C target/pinned-wpt fetch --quiet --depth 1 origin 0968c868d8095217d18d86b34c7f21dccae58768
          git -C target/pinned-wpt checkout --quiet FETCH_HEAD -- FileAPI/

      - name: WPT release gate (--strict; non-zero exit is the honest blocker status)
        run: cargo run --package boa_fapi_wpt -- --manifest wpt-manifest.json --expectations expectations.json --upstream-root target/pinned-wpt --strict --json target/wpt-release.json --junit target/wpt-release.xml

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-release-reports
          path: |
            target/wpt-release.json
            target/wpt-release.xml

  # Mechanical negative controls (M9E-R1 §6.4/§7): mutated upstream,
  # inventory, expectation and result sets must each make the gate non-zero.
  m9e-gate-negative-controls:
    name: M9E gate negative controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@1.91.0

      - name: M9E-R1 mutation fixtures (must be non-zero)
        run: cargo test --package boa_fapi_wpt --test gate_remediation -- --test-threads=1
